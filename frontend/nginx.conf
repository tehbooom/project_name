server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 512k;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 1d;
        try_files $uri =404;
    }

    location /v1/ {
        proxy_pass http://app:8080;
        include /etc/nginx/proxy_params;
    }

    location = /project {
        proxy_pass http://app:8080;
        include /etc/nginx/proxy_params;
    }

    location /health/ {
        proxy_pass http://app:8080;
        include /etc/nginx/proxy_params;
    }

    location /otel/ {
        proxy_pass http://app:8080;
        proxy_request_buffering off;
        include /etc/nginx/proxy_params;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
