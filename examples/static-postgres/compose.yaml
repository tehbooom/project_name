services:
  app:
    build:
      context: ../..
    init: true
    read_only: true
    environment:
      LISTENING_PORT: "8080"
      WORDS_DIR: /app/words
      UNSAFE_MODE_ENABLED: "true"
      WORD_STORE_DRIVER: postgres
      WORD_STORE_POSTGRES_DSN: postgres://project_name:project_name@postgres:5432/project_name?sslmode=disable
      WORD_STORE_AUTO_MIGRATE: "true"
      WORD_STORE_SEED: "true"
      AUTH_DRIVERS: static-token
      STATIC_ADMIN_TOKEN_FILE: /tmp/project-name-admin-token
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: console
      OTEL_SERVICE_NAME: project-name
    tmpfs:
      - /tmp:mode=700,uid=65532,gid=65532
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    read_only: true
    ports:
      - "8080:8080"
    depends_on:
      app:
        condition: service_healthy
    tmpfs:
      - /tmp:mode=700,uid=101,gid=101
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: project_name
      POSTGRES_USER: project_name
      POSTGRES_PASSWORD: project_name
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_name -d project_name"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
