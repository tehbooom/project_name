services:
  app:
    build:
      context: ../..
    init: true
    read_only: true
    environment:
      LISTENING_PORT: "8080"
      WORDS_DIR: /app/words
      UNSAFE_MODE_ENABLED: "true"
      WORD_STORE_DRIVER: postgres
      WORD_STORE_POSTGRES_DSN: postgres://project_name:project_name@postgres:5432/project_name?sslmode=disable
      WORD_STORE_AUTO_MIGRATE: "true"
      WORD_STORE_SEED: "true"
      AUTH_DRIVERS: oidc
      OIDC_PROVIDERS_JSON: >-
        [{
          "name": "keycloak",
          "issuer": "http://localhost:8081/realms/project-name",
          "audience": "project-name",
          "jwks_url": "http://keycloak:8080/realms/project-name/protocol/openid-connect/certs",
          "role_claim": "realm_access.roles",
          "moderator_role": "moderator",
          "contributor_role": "contributor",
          "signing_algorithms": ["RS256"]
        }]
      OTEL_TRACES_EXPORTER: none
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: console
      OTEL_SERVICE_NAME: project-name
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    tmpfs:
      - /tmp:mode=700,uid=65532,gid=65532
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    read_only: true
    ports:
      - "8080:8080"
    depends_on:
      app:
        condition: service_healthy
    tmpfs:
      - /tmp:mode=700,uid=101,gid=101
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: project_name
      POSTGRES_USER: project_name
      POSTGRES_PASSWORD: project_name
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_name -d project_name"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
